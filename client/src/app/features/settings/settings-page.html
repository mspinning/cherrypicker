<div class="page">
  <div class="head">
    <a class="back" routerLink="/">
      <app-icon name="back" [size]="16" />
      Zurück zu Heute
    </a>
    <h1 class="head__title">Einstellungen</h1>
  </div>

  <nav class="tabs" aria-label="Bereiche der Einstellungen">
    <a class="tab" routerLink="users" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      <app-icon name="users" [size]="18" />
      Benutzer
      @if (pendingCount()) {
        <span class="tab__badge" [attr.aria-label]="pendingCount() + ' warten auf Freigabe'">{{ pendingCount() }}</span>
      }
    </a>
    <a class="tab" routerLink="knowledge" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      <app-icon name="knowledge" [size]="18" />
      Wissensquellen
    </a>
  </nav>

  <router-outlet />
</div>
