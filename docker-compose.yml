name: crm

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by docker/postgres/init.sh to create the Keycloak database
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Public URL -> tokens always carry this issuer, even when requested
      # from inside the Docker network via http://keycloak:8080
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm import (${CRM_BACKEND_CLIENT_SECRET})
      CRM_BACKEND_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak/crm-realm.json:/opt/keycloak/data/import/crm-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  bifrost:
    # LLM gateway (OpenAI-compatible API in front of Anthropic, OpenAI, ...).
    # Providers/keys are configured via the web UI at http://localhost:${BIFROST_PORT}
    # and persisted in the bifrost-data volume. Keys passed below can be
    # referenced there as "env.ANTHROPIC_API_KEY" instead of pasting them in.
    image: maximhq/bifrost:v2.2.3
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${BIFROST_LOG_LEVEL:-info}
      LOG_STYLE: pretty
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Required once to create the initial admin account in the web UI
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
    ports:
      - "${BIFROST_PORT:-8081}:8080"
    volumes:
      - bifrost-data:/app/data
    # Lets the container reach services on the host (e.g. Ollama at
    # http://host.docker.internal:11434). Built into Docker Desktop, needed on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Healthcheck is built into the image (GET /health)

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # OpenAI-compatible base URL of the Bifrost gateway
      BIFROST_URL: http://bifrost:8080
      # Virtual key from the Bifrost UI (governance is on, calls without it get 401)
      BIFROST_VIRTUAL_KEY: ${BIFROST_VIRTUAL_KEY:-}
      # Knowledge base: model for embeddings and its vector size (see README)
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama/bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      STORAGE_DIR: /app/storage
      KNOWLEDGE_MAX_UPLOAD_MB: ${KNOWLEDGE_MAX_UPLOAD_MB:-50}
    volumes:
      - server-storage:/app/storage
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      bifrost:
        condition: service_healthy

volumes:
  postgres-data:
  bifrost-data:
  server-storage:
